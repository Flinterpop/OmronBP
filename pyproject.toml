[project]
name = "omron-bp"
version = "0.1.2"
description = "Download readings from OMRON Bluetooth blood-pressure monitors"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["bleak>=1.0"]

[project.scripts]
omron-bp = "omron_bp.cli:main"

[project.optional-dependencies]
dev = ["pytest", "mypy", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["omron_bp*"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "ANN", "RET", "SIM", "PL"]
ignore = [
    "S101",    # asserts are required by the coding guidelines
    "PLR2004", # magic values in tests / bit positions
]

[tool.ruff.lint.pylint]
max-args = 7  # drawing primitives take coordinates, size and colour

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "PLR"]

[tool.mypy]
strict = true
python_version = "3.11"
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
